let lang='fr';
try{const s=localStorage.getItem('ch-lang');if(s==='fr'||s==='en')lang=s}catch(e){}
const $=id=>document.getElementById(id);
let tab='once',amt=1,sa=2,ti=0,thanks=false;
const fmt=n=>n.toLocaleString(lang==='fr'?'fr-FR':'en-US').replace(/[\u202f\u00a0]/g,'\u00a0');

function drawGift(){
  const d=D[lang],sp=tab==='sponsor';
  $('amts').classList.toggle('hidden',sp);
  $('amts').innerHTML=d.amts.map((a,i)=>`<button data-i="${i}" class="py-2 rounded-md border ${i===amt?'on':''}">${fmt(a)}</button>`).join('');
  const val=sp?d.sp:d.amts[amt],per=tab==='once'?'':d.per;
  $('impact').innerHTML=sp?d.imp_sp:`${d.imp_pre}<b>${fmt(val)}&nbsp;FCFA</b> ${d.imp[amt]}`;
  $('give').textContent=`${d.give} ${fmt(val)} FCFA${per}`;
  $('thx').textContent=thanks?d.thx:'';
}
function drawSvc(){
  const s=D[lang].svc;
  $('svcList').innerHTML=s.map((x,i)=>`<li><button data-i="${i}" class="w-full flex justify-between items-center px-3 py-3 border-b text-left ${i===sa?'bg-lime font-medium':''}"><span>${x[0]}</span>${i===sa?'<span>→</span>':''}</button></li>`).join('');
  $('svcTitle').textContent=s[sa][0];$('svcText').textContent=s[sa][1];
}
function drawT(){
  const t=D[lang].T[ti];
  $('quote').textContent='“'+t[0]+'”';$('who').textContent=t[1];$('role').textContent=t[2];$('city').textContent=t[2].split(', ').pop();$('rate').textContent=t[3]+' ★';
}
function applyLang(){
  const d=D[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>{const v=d[el.dataset.i];if(typeof v==='string')el.innerHTML=v});
  document.querySelectorAll('.langBtn').forEach(b=>{const on=b.dataset.lang===lang;b.classList.toggle('lang-on',on);b.setAttribute('aria-pressed',on)});
  $('prev').setAttribute('aria-label',lang==='fr'?'Précédent':'Previous');
  $('next').setAttribute('aria-label',lang==='fr'?'Suivant':'Next');
  drawGift();drawSvc();drawT();
}
document.querySelectorAll('.langBtn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('ch-lang',lang)}catch(e){}applyLang()});

document.querySelectorAll('[data-img]').forEach(el=>{const u=IMAGES[el.dataset.img];if(u){const i=new Image();i.src=u;i.alt='';el.prepend(i);const sp=el.querySelector(':scope>span');if(sp)sp.remove()}});

const mb=$('menuBtn'),mm=$('mobileMenu');
mb.onclick=()=>{const h=mm.classList.toggle('hidden');mb.setAttribute('aria-expanded',String(!h))};

$('amts').onclick=e=>{const b=e.target.closest('button');if(b){amt=+b.dataset.i;thanks=false;drawGift()}};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.className='tab px-3 py-1.5 rounded-md text-ink/60');
  t.className='tab px-3 py-1.5 rounded-md on';tab=t.dataset.tab;thanks=false;drawGift();
});
$('give').onclick=()=>{thanks=true;drawGift()};
$('svcList').onclick=e=>{const b=e.target.closest('button');if(b){sa=+b.dataset.i;drawSvc()}};
$('prev').onclick=()=>{ti=(ti+2)%3;drawT()};
$('next').onclick=()=>{ti=(ti+1)%3;drawT()};
applyLang();
</script>
